name: Build Debian 13 DEB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build .deb on Debian 13
    runs-on: ubuntu-24.04

    container:
      image: debian:13

    env:
      CI: "true"
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

    steps:
      - name: Install system dependencies
        run: |
          apt-get update

          apt-get install -y \
            ca-certificates \
            curl \
            wget \
            git \
            build-essential \
            pkg-config \
            nodejs \
            npm \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            file

          node --version
          npm --version
          git --version

          rm -rf /var/lib/apt/lists/*

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Prepare Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree

      - name: Install pnpm
        run: |
          npm install -g pnpm@10
          pnpm --version

      - name: Install Rust
        run: |
          curl --proto '=https' \
            --tlsv1.2 \
            -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal

          . "$HOME/.cargo/env"

          rustc --version
          cargo --version

      - name: Install dependencies
        run: |
          . "$HOME/.cargo/env"
          pnpm install --frozen-lockfile

      - name: Build Debian package
        run: |
          . "$HOME/.cargo/env"

          pnpm tauri build --bundles deb

      - name: Verify DEB
        run: |
          echo "Generated Debian packages:"

          find . -type f -name "*.deb" -print

          DEB_COUNT=$(find . -type f -name "*.deb" | wc -l)

          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "ERROR: No .deb package was generated."
            exit 1
          fi

          echo "Found $DEB_COUNT Debian package(s)."

          find . -type f -name "*.deb" -exec file {} \;

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v5
        with:
          name: easy-writing-debian-13
          path: |
            **/*.deb
          if-no-files-found: error
          retention-days: 30
