name: Build Debian

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

jobs:
  build-debian:
    name: Build Debian amd64
    runs-on: ubuntu-latest

    container:
      image: debian:12

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update

          apt-get install -y \
            ca-certificates \
            curl \
            wget \
            git \
            file \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Node.js 22
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs

      - name: Install pnpm
        run: |
          npm install -g pnpm

      - name: Install Rust
        run: |
          curl --proto '=https' \
            --tlsv1.2 \
            -sSf https://sh.rustup.rs \
            | sh -s -- -y

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          node --version
          npm --version
          pnpm --version
          rustc --version
          cargo --version

      - name: Install frontend dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build Debian package
        run: |
          pnpm tauri build --bundles deb

      - name: List generated files
        run: |
          find src-tauri/target/release/bundle/deb \
            -maxdepth 1 \
            -type f \
            -print

      - name: Verify Debian metadata
        shell: bash
        run: |
          PACKAGE=$(find \
            src-tauri/target/release/bundle/deb \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: No .deb package found"
            exit 1
          fi

          echo "Package: $PACKAGE"
          echo

          echo "===== Package ====="
          dpkg-deb -f "$PACKAGE" Package

          echo "===== Version ====="
          dpkg-deb -f "$PACKAGE" Version

          echo "===== Architecture ====="
          dpkg-deb -f "$PACKAGE" Architecture

          echo "===== Depends ====="
          dpkg-deb -f "$PACKAGE" Depends

      - name: Validate package identity
        shell: bash
        run: |
          PACKAGE=$(find \
            src-tauri/target/release/bundle/deb \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            | head -n 1)

          NAME=$(dpkg-deb -f "$PACKAGE" Package)
          VERSION=$(dpkg-deb -f "$PACKAGE" Version)
          ARCH=$(dpkg-deb -f "$PACKAGE" Architecture)

          test "$NAME" = "easy-writing"
          test "$VERSION" = "1.1.0"
          test "$ARCH" = "amd64"

          echo "Debian package validation passed."

      - name: Inspect desktop entry
        shell: bash
        run: |
          PACKAGE=$(find \
            src-tauri/target/release/bundle/deb \
            -maxdepth 1 \
            -type f \
            -name "*.deb" \
            | head -n 1)

          echo "===== Package contents ====="

          dpkg-deb -c "$PACKAGE"

          DESKTOP_PATH=$(dpkg-deb -c "$PACKAGE" \
            | awk '{print $6}' \
            | grep '\.desktop$' \
            | head -n 1)

          echo
          echo "Desktop file:"
          echo "$DESKTOP_PATH"

          echo
          echo "===== Desktop entry ====="

          dpkg-deb --fsys-tarfile "$PACKAGE" \
            | tar -xOf - "./$DESKTOP_PATH"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: easy-writing-debian-amd64
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
