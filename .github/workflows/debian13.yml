name: Build Debian 13 DEB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build .deb on Debian 13
    runs-on: ubuntu-24.04

    container:
      image: debian:13

    env:
      CI: "true"
      SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"

    steps:
      # Debian 13 容器默认没有 git/node 等工具，
      # 所以先安装基础依赖
      - name: Install system dependencies
        run: |
          apt-get update

          apt-get install -y \
            ca-certificates \
            curl \
            wget \
            git \
            build-essential \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            file

          rm -rf /var/lib/apt/lists/*

      # 拉取源码
      - name: Checkout repository
        uses: actions/checkout@v5

      # 检查 Git 环境
      - name: Prepare Git
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          echo "Workspace:"
          pwd

          echo "Git:"
          git --version

          git -C "$GITHUB_WORKSPACE" rev-parse --is-inside-work-tree

      # 安装 Node.js 22
      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs

          node --version
          npm --version

      # 不使用 Corepack，直接安装 pnpm
      - name: Install pnpm
        run: |
          npm install -g pnpm@10

          pnpm --version

      # 安装 Rust
      - name: Install Rust
        run: |
          curl --proto '=https' \
            --tlsv1.2 \
            -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal

          . "$HOME/.cargo/env"

          rustc --version
          cargo --version

      # pnpm 依赖安装
      - name: Install dependencies
        run: |
          . "$HOME/.cargo/env"

          pnpm install --frozen-lockfile

      # 构建 Debian 软件包
      - name: Build Debian package
        run: |
          . "$HOME/.cargo/env"

          pnpm tauri build --bundles deb

      # 检查生成的 deb
      - name: Verify DEB
        run: |
          echo "Generated Debian packages:"

          find . -type f -name "*.deb" -print

          DEB_COUNT=$(find . -type f -name "*.deb" | wc -l)

          if [ "$DEB_COUNT" -eq 0 ]; then
            echo "ERROR: No .deb package was generated."
            exit 1
          fi

          echo "Found $DEB_COUNT Debian package(s)."

          find . -type f -name "*.deb" -exec file {} \;

      # 上传 .deb
      - name: Upload DEB artifact
        uses: actions/upload-artifact@v5
        with:
          name: easy-writing-debian-13
          path: |
            **/*.deb
          if-no-files-found: error
          retention-days: 30
