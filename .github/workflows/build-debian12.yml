name: Build Debian 12

"on":
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debian 12 amd64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inside Debian 12
        run: |
          docker run --rm \
            --user root \
            -v "$PWD:/workspace" \
            -w /workspace \
            debian:12 \
            bash -euxo pipefail -c '
              apt-get update

              apt-get install -y \
                ca-certificates \
                curl \
                git \
                build-essential \
                pkg-config \
                libssl-dev \
                libgtk-3-dev \
                libwebkit2gtk-4.1-dev \
                libayatana-appindicator3-dev \
                librsvg2-dev \
                patchelf \
                file \
                xz-utils \
                dpkg-dev

              curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
              apt-get install -y nodejs

              npm install -g pnpm@10

              curl \
                --proto "=https" \
                --tlsv1.2 \
                -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal

              export PATH="$HOME/.cargo/bin:$PATH"

              rustc --version
              cargo --version
              node --version
              pnpm --version

              rustup target add x86_64-unknown-linux-gnu

              pnpm install --frozen-lockfile

              pnpm tauri build \
                --target x86_64-unknown-linux-gnu \
                --bundles deb

              echo "===== Debian packages ====="

              find src-tauri/target \
                -type f \
                -name "*.deb" \
                -print

              PACKAGE=$(find src-tauri/target \
                -type f \
                -name "*.deb" \
                | head -n 1)

              test -n "$PACKAGE"

              echo "===== Package ====="
              echo "$PACKAGE"

              echo "===== Package information ====="
              dpkg-deb --info "$PACKAGE"

              echo "===== Package contents ====="
              dpkg-deb --contents "$PACKAGE"
            '

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: easy-writing-debian12-amd64
          path: src-tauri/target/**/*.deb
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/**/*.deb
          generate_release_notes: true
