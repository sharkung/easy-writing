```yaml
name: Build Debian 12

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debian12:
    name: Build .deb on Debian 12
    runs-on: ubuntu-24.04

    container:
      image: debian:12

    steps:
      # ========================================
      # 1. Checkout
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ========================================
      # 2. Install system dependencies
      # ========================================
      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          apt-get update

          apt-get install -y \
            curl \
            wget \
            git \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            jq \
            ca-certificates \
            xz-utils \
            sudo

      # ========================================
      # 3. Install Node.js 22
      # ========================================
      - name: Install Node.js
        shell: bash
        run: |
          set -eux

          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs

          node --version
          npm --version

      # ========================================
      # 4. Install pnpm
      # ========================================
      - name: Install pnpm
        shell: bash
        run: |
          set -eux

          npm install -g pnpm@10

          pnpm --version

      # ========================================
      # 5. Install Rust
      # ========================================
      - name: Install Rust
        shell: bash
        run: |
          set -eux

          curl --proto '=https' \
            --tlsv1.2 \
            -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal

          . "$HOME/.cargo/env"

          rustc --version
          cargo --version

      # ========================================
      # 6. Add Rust Linux target
      # ========================================
      - name: Install Rust target
        shell: bash
        run: |
          set -eux

          . "$HOME/.cargo/env"

          rustup target add x86_64-unknown-linux-gnu

      # ========================================
      # 7. Install frontend dependencies
      # ========================================
      - name: Install frontend dependencies
        shell: bash
        run: |
          set -eux

          pnpm install --frozen-lockfile

      # ========================================
      # 8. Build Tauri Debian package
      # ========================================
      - name: Build Tauri
        shell: bash
        run: |
          set -eux

          . "$HOME/.cargo/env"

          pnpm tauri build --bundles deb

      # ========================================
      # 9. Find generated .deb
      # ========================================
      - name: Show generated packages
        shell: bash
        run: |
          set -eux

          echo "===== Debian packages ====="

          find src-tauri/target/release/bundle/deb \
            -type f \
            -name "*.deb" \
            -print

          echo "===== Package information ====="

          for pkg in src-tauri/target/release/bundle/deb/*.deb; do
            echo "----- $pkg -----"
            dpkg-deb -I "$pkg"
          done

      # ========================================
      # 10. Upload artifact
      # ========================================
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: easy-writing-debian12-amd64
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      # ========================================
      # 11. Upload to GitHub Release
      # ========================================
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/deb/*.deb
          generate_release_notes: true
```
