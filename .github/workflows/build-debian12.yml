yaml
name: Build Debian 12

on:
  push:
    branches:
      - main

    tags:
      - "v*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debian12:

    name: Debian 12 amd64

    runs-on: ubuntu-24.04

    container:
      image: debian:12

    steps:

      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4


      # ==========================================
      # System dependencies
      # ==========================================
      - name: Install system dependencies
        shell: bash
        run: |
          set -eux

          apt-get update

          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates \
            curl \
            wget \
            git \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            xz-utils \
            jq


      # ==========================================
      # Node.js 22
      # ==========================================
      - name: Install Node.js
        shell: bash
        run: |
          set -eux

          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -

          apt-get install -y nodejs

          node --version
          npm --version


      # ==========================================
      # pnpm
      # ==========================================
      - name: Install pnpm
        shell: bash
        run: |
          set -eux

          npm install --global pnpm@10

          pnpm --version


      # ==========================================
      # Rust
      # ==========================================
      - name: Install Rust
        shell: bash
        run: |
          set -eux

          curl \
            --proto '=https' \
            --tlsv1.2 \
            -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

          "$HOME/.cargo/bin/rustc" --version
          "$HOME/.cargo/bin/cargo" --version


      # ==========================================
      # Rust target
      # ==========================================
      - name: Install Rust Linux target
        shell: bash
        run: |
          set -eux

          "$HOME/.cargo/bin/rustup" target add \
            x86_64-unknown-linux-gnu


      # ==========================================
      # Install frontend dependencies
      # ==========================================
      - name: Install dependencies
        shell: bash
        run: |
          set -eux

          pnpm install --frozen-lockfile


      # ==========================================
      # Build Debian package
      # ==========================================
      - name: Build Debian package
        shell: bash
        run: |
          set -eux

          pnpm tauri build \
            --target x86_64-unknown-linux-gnu \
            --bundles deb


      # ==========================================
      # Inspect package
      # ==========================================
      - name: Inspect Debian package
        shell: bash
        run: |
          set -eux

          echo "=========================================="
          echo "Generated Debian packages"
          echo "=========================================="

          find src-tauri/target \
            -type f \
            -name "*.deb" \
            -print

          PACKAGE=$(find src-tauri/target \
            -type f \
            -name "*.deb" \
            | head -n 1)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: No Debian package found"
            exit 1
          fi

          echo
          echo "=========================================="
          echo "Package"
          echo "=========================================="

          echo "$PACKAGE"

          echo
          echo "=========================================="
          echo "dpkg-deb information"
          echo "=========================================="

          dpkg-deb --info "$PACKAGE"

          echo
          echo "=========================================="
          echo "Package contents"
          echo "=========================================="

          dpkg-deb --contents "$PACKAGE"


      # ==========================================
      # Upload GitHub Actions Artifact
      # ==========================================
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: easy-writing-debian12-amd64
          path: src-tauri/target/**/*.deb
          if-no-files-found: error


      # ==========================================
      # GitHub Release
      # ==========================================
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/**/*.deb
          generate_release_notes: true
