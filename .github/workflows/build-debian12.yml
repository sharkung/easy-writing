yaml
name: Build Debian 12

"on":
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build Debian 12 amd64
    runs-on: ubuntu-24.04

    container:
      image: debian:12

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            ca-certificates \
            curl \
            git \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            file \
            xz-utils

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs

      - name: Install pnpm
        run: |
          npm install -g pnpm@10

      - name: Install Rust
        run: |
          curl --proto '=https' \
            --tlsv1.2 \
            -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust target
        run: |
          "$HOME/.cargo/bin/rustup" target add x86_64-unknown-linux-gnu

      - name: Install project dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Build Debian package
        run: |
          pnpm tauri build \
            --target x86_64-unknown-linux-gnu \
            --bundles deb

      - name: Find Debian package
        run: |
          find src-tauri/target \
            -type f \
            -name "*.deb" \
            -print

      - name: Verify Debian package
        run: |
          PACKAGE=$(find src-tauri/target \
            -type f \
            -name "*.deb" \
            | head -n 1)

          test -n "$PACKAGE"

          echo "Package: $PACKAGE"

          dpkg-deb --info "$PACKAGE"

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: easy-writing-debian12-amd64
          path: src-tauri/target/**/*.deb
          if-no-files-found: error
